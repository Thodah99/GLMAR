<style>

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  --bg: #FDF4F5; --bg-alt: #FBE9EE; --ink: #2B1B2E; --muted: #8B7684;
  --accent: #E63965; --accent-dark: #C41F4B; --gold: #F2A65A; --surface: #FFFFFF; --line: #F0D9DF;
  background: var(--bg); color: var(--ink); font-family: 'Work Sans', sans-serif;

}
/* Vendor dashboard "lol lol" theme controls — dark mode + accent color are a
   per-device preference for the person running the dashboard, never applied
   to the customer-facing side of the app. See applyDashTheme(). */
body.g-dash-dark {
  --bg: #121212; --bg-alt: #1A1A1D; --ink: #EDEDED; --muted: #9A9A9E; --surface: #1E1E21; --line: #2E2E32;
}
.g-theme-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.g-swatch { width:26px; height:26px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }

.g-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
.g-logo { background:none; border:none; font-family:'Fraunces', serif; font-weight:700; font-size:19px; letter-spacing:0.02em; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px; padding:0; }
.g-logo-mark { color: var(--accent); }
.g-header-cta { font-size: 13px; padding: 8px 14px; }

.g-page { max-width: 560px; margin: 0 auto; padding: 20px; padding-bottom: 60px; }
.g-narrow { max-width: 420px; }
.g-center { text-align:center; }
.g-center-text { display:block; text-align:center; margin: 10px auto 0; }

.g-hero { padding: 20px 4px 4px; }
@keyframes gFadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
.g-fade-in { opacity:0; animation: gFadeUp .6s cubic-bezier(.16,1,.3,1) forwards; }
.g-hero .g-kicker { animation-delay: .02s; }
.g-hero .g-h1 { animation-delay: .1s; }
.g-hero .g-sub { animation-delay: .2s; }
.g-hero .g-live-stat { animation-delay: .3s; }
.g-accent-text { background: linear-gradient(100deg, var(--accent) 15%, var(--gold) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.g-live-stat { display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:8px 14px; border-radius:999px; background: var(--surface); border:1px solid var(--line); font-size:13px; font-weight:600; box-shadow: 0 6px 18px rgba(43,27,46,0.06); }
.g-live-dot { width:8px; height:8px; border-radius:50%; background:#2FBF71; box-shadow:0 0 0 0 rgba(47,191,113,0.5); animation: gPulse 1.8s ease-out infinite; flex-shrink:0; }
@keyframes gPulse { 0% { box-shadow: 0 0 0 0 rgba(47,191,113,0.5); } 70% { box-shadow: 0 0 0 8px rgba(47,191,113,0); } 100% { box-shadow: 0 0 0 0 rgba(47,191,113,0); } }
.g-kicker { font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin: 0 0 8px; }
.g-h1 { font-family:'Fraunces', serif; font-weight:700; font-size: 38px; line-height:1.06; margin:0 0 10px; }
.g-h3 { font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin: 4px 0 4px; }
.g-h4 { font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin: 0 0 10px; }
.g-sub { color: var(--muted); font-size:15px; margin:0; max-width: 360px; }

.g-search-card { background: var(--surface); border-radius: 18px; padding: 18px; margin-top:18px; box-shadow: 0 10px 30px rgba(43,27,46,0.08); border:1px solid var(--line); }
.g-field { margin-bottom: 16px; }

.g-feature-card:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(43,27,46,0.11); }
.g-feature-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; -webkit-overflow-scrolling:touch; }

.g-asap-card { background: var(--bg-alt); border-radius:14px; padding:14px 16px; }

.g-asap-card p { margin:0; color: var(--muted); font-size:13.5px; }

.g-cat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
.g-cat-tile { background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; font-family:'Work Sans',sans-serif; font-size:11.5px; font-weight:600; color:var(--ink); text-align:center; line-height:1.2; transition: border-color .15s ease, transform .1s ease; }
.g-cat-tile:hover { border-color: var(--accent); }

.g-section-title { margin-top: 26px; }
.g-list { display:flex; flex-direction:column; gap:8px; }

.g-dash-stat-num { font-family:'Fraunces',serif; font-size:21px; color: var(--ink); }

.g-gallery { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:10px; }

.g-lightbox { position:fixed; inset:0; background:rgba(20,10,16,0.92); z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px; }

.g-lightbox-close:hover { background:rgba(255,255,255,0.28); }

.g-plan-total { display:flex; justify-content:space-between; align-items:center; padding-top:14px; margin-top: 10px; border-top: 1px dashed var(--line); font-weight:600; }

<script>
/* =====================================================================
   GLAMR — Firebase config
   Get these values from: Firebase console -> Project settings (gear icon)
   -> General tab -> "Your apps" -> the web app (</>) -> SDK setup and
   configuration -> "Config". Paste them in below. These values are safe
   to expose publicly (they identify your project, they don't grant
   access) — real access control lives entirely in your Firestore rules.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyD9jF2VjmPcrygU_xNm2fGjJZAURAac8Y8",
  authDomain: "glamr-33934.firebaseapp.com",
  projectId: "glamr-33934",
  storageBucket: "glamr-33934.firebasestorage.app",
  messagingSenderId: "467391315343",
  appId: "1:467391315343:web:10fa18e796644f5927dffa",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* =====================================================================
   GLAMR — Push notifications (specialists only; customers never log in,
   so there's no account to attach a notification to on their side).
   Lets a specialist know the instant someone taps "Book with Provider"
   on one of their openings, instead of the site owner manually texting
   them the confirm link (see confirmLinkFor()) after the fact.

   Needs one value you'll need to grab yourself, same as firebaseConfig
   above: a Web Push "VAPID key". Get it from Firebase Console -> Project
   settings -> Cloud Messaging -> Web configuration -> "Web Push
   certificates" -> Generate key pair (if you don't have one yet), then
   paste it in below. Notifications won't work until this is filled in.
===================================================================== */
const GLAMR_VAPID_KEY = "PASTE_YOUR_VAPID_KEY_HERE";

let messaging = null;
let swRegistration = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/firebase-messaging-sw.js").then(function (reg) {
    swRegistration = reg;
    if (firebase.messaging.isSupported()) messaging = firebase.messaging();
  }).catch(function (e) { console.error("service worker registration failed:", e); });
}

// Called from the notification prompt screen and from the dashboard toggle.
// Returns a promise resolving true/false so the caller can update the UI.
function enableGlamrNotifications(providerId) {
  if (!messaging) return Promise.resolve(false);
  return Notification.requestPermission().then(function (permission) {
    if (permission !== "granted") return false;
    return messaging.getToken({ vapidKey: GLAMR_VAPID_KEY, serviceWorkerRegistration: swRegistration }).then(function (token) {
      if (!token) return false;
      return db.collection("providers").doc(providerId).update({
        fcmToken: token,
        notificationsEnabled: true,
      }).then(function () { return true; });
    });
  }).catch(function (e) { console.error("enableGlamrNotifications failed:", e); return false; });
}

// Doesn't revoke the browser-level permission (JS can't do that), just tells
// the backend to stop sending — the honest, actually-controllable half of
// "turn notifications off".
function disableGlamrNotifications(providerId) {
  return db.collection("providers").doc(providerId).update({ notificationsEnabled: false })
    .catch(function (e) { console.error("disableGlamrNotifications failed:", e); });
}

</script>

<script>
/* =====================================================================

   Core: real-time last-minute beauty availability marketplace.
   "Build My Look" (occasion → AI plan → real vendor matches) is a
   PHASE 2 feature. It is intentionally paused for the MVP so the
   product carries zero AI/API usage and zero AI credit cost while we
   build vendor supply and real booking behavior. The implementation
   below (constants, state, view, actions) is kept intact and simply
   gated off by GLAMR_ME_ENABLED so it can be switched back on later
   without rebuilding it from scratch. Its current logic is NOT AI —
   it's a hardcoded occasion→service lookup — the real AI step (an LLM
   turning a free-text description into a plan) is the Phase 2 work.
   Data lives in Firebase (Auth + Firestore) so every visitor sees the
   same live marketplace.
===================================================================== */

const GLAMR_ME_ENABLED = false; // Paused again — thin vendor supply makes the plan-builder mostly return "nothing found." Flip to true once there's enough opening inventory that a plan usually resolves to real bookings.

// Official Glamour master service categories — used everywhere the app
// organizes, searches, filters, or displays services (search, vendor
// signup, opening/deal forms, category pages, deals). Do not add ad hoc
// categories elsewhere; extend this single list instead.
const SERVICES = ['Haircut', 'Barber', 'Braids', 'Locs', 'Natural Hair', 'Silk Press', 'Wig Install', 'Wigs & Extensions', 'Makeup', 'Lashes', 'Brows', 'Nails', 'Skincare', 'Waxing', 'Other Beauty Services'];
const SERVICE_EMOJI = {

  Makeup: '💄', Lashes: '👁️', Brows: '✏️', Nails: '💅🏽', Skincare: '🧴', Waxing: '🕯️', 'Other Beauty Services': '🌸',
};
const WHEN_OPTIONS = ['Today', 'Tomorrow', 'This Weekend'];
// "lol lol" vendor-dashboard-only accent colors — a per-device look-and-feel
// preference, purely cosmetic, never affects the customer-facing app.
const DASH_ACCENTS = [
  { key: 'rose', name: 'Rose', accent: '#E63965', dark: '#C41F4B' },
  { key: 'purple', name: 'Purple', accent: '#7C3AED', dark: '#5B21B6' },
  { key: 'teal', name: 'Teal', accent: '#0D9488', dark: '#0F766E' },
  { key: 'amber', name: 'Amber', accent: '#D97706', dark: '#B45309' },
  { key: 'navy', name: 'Navy', accent: '#1D4ED8', dark: '#1E3A8A' },
];
const TIME_OPTIONS = ['Any time', 'Morning', 'Afternoon', 'Evening'];
const OCCASIONS = ['Date Night', 'Birthday', 'Wedding', 'Vacation', 'Photoshoot', 'Party', 'Just Want to Look Good'];
const OCCASION_SERVICES = {
  'Date Night': ['Haircut', 'Makeup'],
  'Birthday': ['Haircut', 'Nails', 'Makeup'],
  'Wedding': ['Haircut', 'Makeup', 'Nails', 'Lashes'],
  'Vacation': ['Nails', 'Waxing'],
  'Photoshoot': ['Haircut', 'Makeup', 'Lashes'],
  'Party': ['Makeup', 'Nails'],
  'Just Want to Look Good': ['Haircut', 'Nails'],
};
const DEAL_SCOPES = [
  { value: 'general', label: 'General — any last-minute booking' },
  { value: 'specific', label: 'Specific date & time only' },
];
const ADMIN_PASSCODE = 'demo-admin'; // MVP only — not real security
const METRIC_KEYS = ['search_started', 'search_completed', 'appointment_viewed', 'instagram_book_clicked', 'website_book_clicked', 'booking_confirmed', 'provider_signup', 'provider_opening_posted', 'deals_viewed', 'deal_posted', 'review_link_copied', 'review_submitted'];


function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
// GLAMR only serves the Houston/Katy, TX area — every date shown or matched
// ("Today", "Tomorrow", weekend picks) needs to mean Central Time, not
// whatever timezone a device happens to be set to (a vendor's phone set to
// the wrong zone, or a browser defaulting to UTC, would otherwise silently
// shift "today" by a day, especially in the evening). All calendar-date
// math below is anchored to America/Chicago via this helper rather than
// the browser's local clock or toISOString() (which is UTC).
const TX_TIMEZONE = 'America/Chicago';
function txDateParts(d) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: TX_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short',
  }).formatToParts(d || new Date());
  const out = {};
  parts.forEach(function (p) { if (p.type !== 'literal') out[p.type] = p.value; });
  return out; // { year, month, day, weekday }
}

  // as a neutral "day counter" \u2014 this avoids DST re-triggering a timezone
  // conversion partway through the arithmetic.
  const d = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)));
  d.setUTCDate(d.getUTCDate() + offset);
  return d.toISOString().slice(0, 10);

  const p = txDateParts();
  const weekdayIndex = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[p.weekday];
  const toSat = (6 - weekdayIndex + 7) % 7 || 7;
  const base = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)));
  const sat = new Date(base); sat.setUTCDate(base.getUTCDate() + toSat);
  const sun = new Date(sat); sun.setUTCDate(sat.getUTCDate() + 1);

function fmtDate(dstr) {

  if (dstr === t) return 'Today';
  if (dstr === tm) return 'Tomorrow';

  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(t) {
  const parts = t.split(':').map(Number);
  const h = parts[0], m = parts[1];
  const ampm = h >= 12 ? 'PM' : 'AM';

}
function timeBucket(t) {
  const h = Number(t.split(':')[0]);
  if (h < 12) return 'Morning';
  if (h < 17) return 'Afternoon';
  return 'Evening';
}
function matchesWhen(dateStr, when) {
  if (!when || when === 'Any') return true;
  if (when === 'Today') return dateStr === todayStr(0);
  if (when === 'Tomorrow') return dateStr === todayStr(1);

  return true;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------------------------- deals ---------------------------- */

function isDealActive(deal) {
  if (!deal) return false;
  const exp = new Date(deal.expiresAt).getTime();
  if (isNaN(exp)) return false;
  return exp > Date.now();
}
function dealAppliesToOpening(deal, opening) {
  if (!isDealActive(deal)) return false;
  if (deal.service !== opening.service) return false;
  if (deal.scope === 'specific') return deal.specificDate === opening.date && deal.specificTime === opening.time;
  return true;
}
function dealExpiryLabel(deal) {
  if (!deal) return '';
  const exp = new Date(deal.expiresAt);
  if (isNaN(exp.getTime())) return '';
  if (!isDealActive(deal)) return 'Expired';
  const dateStr = exp.toISOString().slice(0, 10);
  const timeStr = String(exp.getHours()).padStart(2, '0') + ':' + String(exp.getMinutes()).padStart(2, '0');
  return 'Expires ' + fmtDate(dateStr) + ' ' + fmtTime(timeStr);
}
function dealDiscountPercent(deal) {
  if (deal.discountPercent) return Number(deal.discountPercent);
  const orig = Number(deal.originalPrice), dp = Number(deal.dealPrice);
  if (!orig || isNaN(orig) || isNaN(dp)) return null;
  return Math.round((1 - dp / orig) * 100);
}
function activeDeals() {
  const out = [];
  S.data.providers.forEach(function (p) {
    if (isDealActive(p.deal)) out.push({ provider: p, deal: p.deal });
  });
  out.sort(function (a, b) { return new Date(a.deal.expiresAt) - new Date(b.deal.expiresAt); });
  return out;
}

// Featured Pros — a rotating home-screen spotlight for vendors who've
// visible to anyone browsing (not just people who already have their link).
// Rotation is deterministic, not random or admin-picked: it advances by a
// fixed window each week based on the calendar week itself, so every Pro
// vendor cycles through fairly over time with zero manual curation. Returns
// an empty list when there are no Pro vendors yet, so the section can hide
// itself entirely rather than show a half-empty spotlight.
function featuredPros(category) {
  const pros = S.data.providers.filter(function (p) { return p.featured && (!category || p.services.indexOf(category) !== -1); });
  if (!pros.length) return [];
  const sorted = pros.slice().sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
  const windowSize = Math.min(5, sorted.length);
  const weekIndex = Math.floor(Date.now() / (7 * 24 * 60 * 60 * 1000));
  const start = (weekIndex * windowSize) % sorted.length;
  const picked = [];
  for (let i = 0; i < windowSize; i++) picked.push(sorted[(start + i) % sorted.length]);
  return picked;
}

/* ---------------------------- QR code (offline, no network) ---------------------------- */

function renderQRSVG(text, size) {
  size = size || 180;
  try {
    const qr = QRCodeCore.create([{ data: text, mode: 'byte' }], { errorCorrectionLevel: 'M' });
    const n = qr.modules.size;
    const data = qr.modules.data;
    const quiet = 4;
    const full = n + quiet * 2;
    let rects = '';
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (data[y * n + x]) rects += '<rect x="' + (x + quiet) + '" y="' + (y + quiet) + '" width="1" height="1"/>';
      }
    }
    return '<svg viewBox="0 0 ' + full + ' ' + full + '" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">' +
      '<rect x="0" y="0" width="' + full + '" height="' + full + '" fill="#fff"/>' +
      '<g fill="#2B1B2E">' + rects + '</g>' +
    '</svg>';
  } catch (e) {
    return '<div class="g-hint">QR code unavailable (' + esc(e.message || 'error') + ')</div>';
  }
}

function runSearch() {
  const s = S.search;
  const relaxed = [];
  const active = { service: s.service, when: s.when, time: (s.time && s.time !== 'Any time') ? s.time : null };
  function apply() {
    return activeOpenings()
      .filter(function (o) { return !active.service || o.service === active.service; })
      .filter(function (o) { return !active.when || matchesWhen(o.date, active.when); })
      .filter(function (o) { return !active.time || matchesTimePref(o.time, active.time); });
  }
  let rows = apply();
  // Thin vendor supply means a fully-specified search can easily land on zero
  // results even though something close exists. Rather than dead-end, drop
  // the least-essential filter first and try again — time of day, then day,
  // then (as a last resort) service — and tell the customer what was relaxed
  // so it reads as "here's what's close," not a silent bait-and-switch.
  if (rows.length === 0 && active.time) { relaxed.push('time of day'); active.time = null; rows = apply(); }
  if (rows.length === 0 && active.when) { relaxed.push(s.when); active.when = null; rows = apply(); }
  if (rows.length === 0 && active.service) { relaxed.push(s.service); active.service = null; rows = apply(); }
  // Location and budget are soft preferences, not hard filters: a customer
  // willing to drive or stretch their budget a little shouldn't have a vendor
  // disappear entirely just because the typed location text or price ceiling
  // doesn't exactly match. Matching openings sort first; everything else
  // still shows, just further down (see viewResults for the section break).
  rows.forEach(function (o) {
    o._placeMatch = matchesPlace(o, s.place);
    o._budgetMatch = matchesBudget(o.price, s.budget);
  });
  const bySelectedOrder = S.sort === 'price'
    ? function (a, b) { return a.price - b.price; }
    : function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); };
  rows.sort(function (a, b) {
    if (a._placeMatch !== b._placeMatch) return a._placeMatch ? -1 : 1;
    if (a._budgetMatch !== b._budgetMatch) return a._budgetMatch ? -1 : 1;
    return bySelectedOrder(a, b);
  });
  return { rows: rows, relaxed: relaxed };
}

function buildGlamrPlan() {
  const g = S.glamr;
  const services = OCCASION_SERVICES[g.occasion] || ['Haircut', 'Makeup'];
  const deadlineKey = g.deadlineDate + g.deadlineTime;
  const budget = g.budget ? Number(g.budget) : null;
  // Location is a soft preference here too: a customer willing to drive
  // shouldn't have a vendor excluded from the plan just because the typed
  // location text doesn't literally match. Openings that match location sort
  // first (and get picked first within budget); everything else is still a
  // valid candidate rather than being dropped from the pool entirely.
  const pool = activeOpenings();
  const plan = [];
  let total = 0;
  services.forEach(function (service) {
    const candidates = pool
      .filter(function (o) { return o.service === service; })
      .filter(function (o) { return (o.date + o.time) <= deadlineKey; })
      .sort(function (a, b) {
        const aMatch = matchesPlace(a, g.location), bMatch = matchesPlace(b, g.location);
        if (aMatch !== bMatch) return aMatch ? -1 : 1;
        return (a.date + a.time).localeCompare(b.date + b.time);

    if (budget) pick = candidates.find(function (o) { return total + o.price <= budget; }) || null;
    if (!pick) pick = candidates[0] || null;
    if (pick) { plan.push(pick); total += pick.price; }

  const covered = plan.map(function (p) { return p.service; });

  g.plan = { services: services, plan: plan, total: total, unmet: unmet };

/* Reads an image file, downsizes it to fit within maxDim x maxDim, and
   returns a compressed JPEG data URL via callback(dataURL). Keeps images
   small enough to live in localStorage without hitting quota limits. */
function fileToCompressedDataURL(file, maxDim, quality, callback) {
  const reader = new FileReader();
  reader.onload = function (e) {
    const img = new Image();
    img.onload = function () {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataURL = canvas.toDataURL('image/jpeg', quality);
      canvas.toBlob(function (blob) { callback(dataURL, blob); }, 'image/jpeg', quality);
    };
    img.onerror = function () { flash('Could not read that image \u2014 try a different file.'); };
    img.src = e.target.result;
  };
  reader.onerror = function () { flash('Could not read that file \u2014 try again.'); };
  reader.readAsDataURL(file);
}

// Uploads a compressed image Blob to Cloud Storage under /providers/{uid}/...,
// matching the Storage security rules (public read, owner-only write, 5MB cap,
// image/* only), and resolves with its public download URL.
function uploadProviderImage(uid, blob, path) {
  return storage.ref('providers/' + uid + '/' + path).put(blob, { contentType: 'image/jpeg' })
    .then(function (snapshot) { return snapshot.ref.getDownloadURL(); });
}
// Best-effort delete of a previously uploaded Storage image, given its
// download URL. Failures are swallowed \u2014 a missing/already-deleted file
// shouldn't block removing it from the portfolio array.
function deleteProviderImageByURL(url) {
  if (!url || url.indexOf('firebasestorage') === -1) return Promise.resolve();
  return storage.refFromURL(url).delete().catch(function () {});
}

// Small "why is this here" label for a soft-matched result — "Other area" if
// the location didn't match, "$X over budget" if the price is above what was
// typed. Blank when a row matches everything asked for (the common case).
function softMatchBadge(o, s) {
  const parts = [];
  if (s.place && s.place.trim() && !o._placeMatch) parts.push('Other area');
  if (s.budget && !o._budgetMatch) {
    const over = Math.round(o.price - Number(s.budget));
    if (over > 0) parts.push('$' + over + ' over budget');
  }
  return parts.join(' \u00b7 ');
}

function vendorHasOpenSlot(p, cat) {
  return S.data.openings.some(function (o) { return o.providerId === p.id && isOpeningLive(o) && (!cat || o.service === cat); });
}

// Per-service opening counts for a vendor, e.g. ["1 opening for Braids",
// "2 openings for Locs"] — feeds the rotating label next to the "View
// Profile" button so a customer sees what's actually available before they
// even click in. Order follows first-appearance in the (date+time) sorted
// openings list, so the soonest service tends to show first.
function openingSummaryItems(openings) {
  const order = [];
  const counts = {};
  openings.forEach(function (o) {
    if (!(o.service in counts)) order.push(o.service);
    counts[o.service] = (counts[o.service] || 0) + 1;
  });
  return order.map(function (s) {
    const n = counts[s];
    return n + ' opening' + (n === 1 ? '' : 's') + ' for ' + s;
  });
}

function vendorRow(p, cat) {
  // cat: restrict "soonest opening" + deal-flag check to one category, or null/undefined for "any category" (directory view)
  const openings = S.data.openings.filter(function (o) { return o.providerId === p.id && isOpeningLive(o) && (!cat || o.service === cat); });
  const soonest = openings.slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); })[0];
  const hasDeal = isDealActive(p.deal) && (!cat || p.deal.service === cat);
  const rotateItems = openingSummaryItems(openings);
  return '<div class="g-row-card' + (soonest ? '' : ' g-dim') + '" style="align-items:flex-start;">' +
    '<div>' +
      '<button type="button" class="g-linklike" data-action="go-vendor" data-value="' + p.id + '" style="font-family:\'Fraunces\',serif;font-size:15px;color:var(--ink);text-decoration:none;">' + esc(p.businessName) + '</button>' +
      (hasDeal ? ' <span class="g-deal-flag">\u26a1 Deal</span>' : '') +
      '<div class="g-hint">' + esc(p.city) + (p.instagram ? ' \u00b7 ' + esc(p.instagram) : '') + '</div>' +
      '<div class="g-chips" style="margin-top:4px;">' + p.services.map(function (s) { return '<span class="g-badge">' + SERVICE_EMOJI[s] + ' ' + s + '</span>'; }).join('') + '</div>' +
      (soonest
        ? '<div class="g-hint" style="margin-top:4px;">Next opening: ' + fmtDate(soonest.date) + ' ' + fmtTime(soonest.time) + ' \u00b7 $' + soonest.price + '</div>'
        : '<div class="g-hint" style="margin-top:4px;">No open slots posted right now \u2014 not currently bookable through GLAMR.</div>') +
    '</div>' +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">' +
      '<button class="g-btn-ghost g-btn-small" data-action="go-vendor" data-value="' + p.id + '">' + (soonest ? 'View Profile' : 'See Profile') + '</button>' +
      (rotateItems.length
        ? '<div class="g-rotate-label" data-items="' + esc(JSON.stringify(rotateItems)) + '" data-idx="0">' + esc(rotateItems[0]) + '</div>'
        : '') +
    '</div>' +
  '</div>';
}

function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
function getPath(obj, path) {
  return path.split('.').reduce(function (cur, k) { return cur == null ? cur : cur[k]; }, obj);
}

// Real back-navigation history (not a hardcoded guess at the previous page) —
// every screen you can land on mid-flow (request form, vendor profile,
// category page, deals) should always have a working way back to wherever
// the customer actually came from, never a dead end.
function snapshotNav() {
  return { view: S.view, activeVendorId: S.activeVendorId, activeCategory: S.activeCategory, dealsCategory: S.dealsCategory, activeOpeningId: S.activeOpeningId };
}
function goTo(view, extra) {
  if (S.view !== view) {
    S.navHistory.push(snapshotNav());
    if (S.navHistory.length > 25) S.navHistory.shift();
    // Mirror the in-app nav stack onto the browser's own history so a
    // customer's phone back button/swipe gesture steps back through GLAMR's
    // screens instead of exiting the app entirely. Only counted as pushed
    // if it actually succeeds, so goBack() below never assumes a browser
    // history entry exists that isn't really there.
    try { history.pushState({ glamrNav: true }, ''); S.pushedHistoryCount++; } catch (e) {}
  }
  S.view = view;
  if (extra) Object.keys(extra).forEach(function (k) { S[k] = extra[k]; });
  render();
}
// The actual state-popping logic, shared by both the in-app Back button and
// the browser's native back button (via the popstate listener below) so
// they can never fall out of sync with each other.
function applyBack() {
  const prev = S.navHistory.pop();
  if (!prev) { S.view = 'home'; }
  else {
    S.view = prev.view;
    S.activeVendorId = prev.activeVendorId;
    S.activeCategory = prev.activeCategory;
    S.dealsCategory = prev.dealsCategory;
    S.activeOpeningId = prev.activeOpeningId;
  }
  render();
}
function goBack() {
  // If we've got a real pushed browser-history entry, go through history.back()
  // so it and a native back gesture both funnel into the same popstate handler
  // below \u2014 avoids popping the in-app stack twice. Falls back to popping
  // directly if pushState never succeeded (e.g. a restrictive embed context).
  if (S.pushedHistoryCount > 0) {
    try { history.back(); return; } catch (e) {}
  }
  applyBack();
}
window.addEventListener('popstate', function () {
  if (S.pushedHistoryCount > 0) S.pushedHistoryCount--;
  applyBack();
});

// Optimistic local increment + fire-and-forget Firestore increment for the
// vendor analytics counters (profile/offer/portfolio views, IG clicks).
// FieldValue.increment is used server-side so concurrent visitors never
// clobber each other's count.
function bumpProviderStat(providerId, field) {
  const provider = providerById(providerId);
  if (!provider) return;
  provider[field] = (provider[field] || 0) + 1;
  db.collection('providers').doc(providerId).update({ [field]: firebase.firestore.FieldValue.increment(1) })
    .catch(function (e) { console.error('bumpProviderStat(' + field + ') failed:', e); });
}

// Real-time, not a one-time fetch: a customer joining the waitlist while
// the vendor is already sitting on their dashboard needs to show up
// immediately \u2014 they're a walk-in waiting right now, not someone who can
// wait for the vendor's next page reload. onSnapshot keeps S.data.waitlist
// in sync automatically for as long as the vendor is logged in.
let waitlistUnsubscribe = null;
function loadWaitlistForProvider(uid) {
  if (waitlistUnsubscribe) { waitlistUnsubscribe(); waitlistUnsubscribe = null; }
  waitlistUnsubscribe = db.collection('waitlist').where('providerId', '==', uid).onSnapshot(function (snap) {
    S.data.waitlist = snap.docs.map(docToObj);
    render();
  }, function (e) { console.error('loadWaitlistForProvider failed:', e); });
}
function stopWaitlistListener() {
  if (waitlistUnsubscribe) { waitlistUnsubscribe(); waitlistUnsubscribe = null; }
}

function handleAction(action, target) {
  const value = target.getAttribute('data-value');
  if (action === 'go-home') { goTo('home'); return; }
  if (action === 'go-back') { goBack(); return; }
  if (action === 'go-results') { goTo('results'); return; }
  if (action === 'go-admin') { goTo('admin'); return; }
  if (action === 'admin-close') { S.view = 'home'; S.adminUnlocked = false; S.adminCode = ''; render(); return; }
  if (action === 'go-glamrme') { if (!GLAMR_ME_ENABLED) return; goTo('glamrme'); S.glamr.step = 'occasion'; logEvent('glamr_me_started'); return; }
  if (action === 'go-glamrme-edit') { if (!GLAMR_ME_ENABLED) return; S.glamr.step = 'occasion'; render(); return; }
  if (action === 'go-deals') { logEvent('deals_viewed'); goTo('deals', { dealsCategory: null }); return; }
  if (action === 'set-deals-category') { S.dealsCategory = value || null; render(); return; }
  if (action === 'set-deals-home-category') { S.dealsHomeCategory = value || ''; render(); return; }
  if (action === 'go-category') { goTo('category', { activeCategory: value }); return; }
  if (action === 'go-directory') { goTo('directory'); return; }
  if (action === 'search-category') {
    markSearchStarted();
    S.search.service = value;
    logEvent('search_completed');
    goTo('results');
    return;
  }
  if (action === 'go-vendor') {
    bumpProviderStat(value, 'profileViews');
    goTo('vendorProfile', { activeVendorId: value });
    return;
  }
  if (action === 'go-review') {
    goTo('review', {
      activeVendorId: value,
      reviewForm: { rating: 0, name: '', comment: '' },
      reviewSubmitted: false,
    });
    return;
  }
  if (action === 'set-review-rating') { S.reviewForm.rating = Number(value); render(); return; }
  if (action === 'submit-review') {
    const f = S.reviewForm;
    if (!(f.rating > 0)) return;
    const review = {
      providerId: S.activeVendorId, rating: f.rating,
      name: f.name.trim(), comment: f.comment.trim(), createdAt: Date.now(),
    };
    db.collection('reviews').add(review).then(function (ref) {
      S.data.reviews.push(Object.assign({ id: ref.id }, review));
      render();
    }).catch(function (e) { console.error('submit-review failed:', e); flash('Could not submit review \u2014 try again.'); render(); });
    logEvent('review_submitted');
    S.reviewSubmitted = true;
    S.navHistory = []; // completed flow — "Back to Profile" below is a fresh destination, not a history pop
    render(); return;
  }
  if (action === 'copy-review-link') {
    logEvent('review_link_copied');
    const link = value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { flash('Review link copied.'); }).catch(function () { flash('Copy failed \u2014 select and copy the link manually.'); });
    } else {
      flash('Select and copy the link manually.');
    }
    return;
  }
  if (action === 'copy-waitlist-link' || action === 'copy-confirm-link') {
    const link = value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { flash('Link copied.'); }).catch(function () { flash('Copy failed \u2014 select and copy the link manually.'); });
    } else {
      flash('Select and copy the link manually.');
    }
    return;
  }
  if (action === 'featured-instagram-click') {
    bumpProviderStat(value, 'instagramClicks');
    logEvent('featured_instagram_clicked');
    return; // real navigation to Instagram is handled by the anchor's own href/target
  }
  if (action === 'toggle-notifications') {
    const provider = providerById(value);
    if (!provider) return;
    if (provider.notificationsEnabled) {
      disableGlamrNotifications(value).then(function () { provider.notificationsEnabled = false; render(); });
    } else {
      enableGlamrNotifications(value).then(function (ok) {
        if (!ok) { flash('Couldn\u2019t turn on notifications \u2014 check that notifications are allowed for this site in your browser settings.'); return; }
        provider.notificationsEnabled = true; render();
      });
    }
    return;
  }
  if (action === 'toggle-dash-theme') {
    S.dashDark = !S.dashDark;
    try { localStorage.setItem('glamr-dash-dark', S.dashDark ? '1' : '0'); } catch (e) {}
    render(); return;
  }
  if (action === 'set-dash-accent') {
    S.dashAccent = value;
    try { localStorage.setItem('glamr-dash-accent', value); } catch (e) {}
    render(); return;
  }
  if (action === 'toggle-featured') {
    const provider = providerById(S.session);
    if (!provider) return;
    const newFeatured = !provider.featured;
    db.collection('providers').doc(provider.id).update({ featured: newFeatured }).then(function () {
      provider.featured = newFeatured; render();
    }).catch(function (e) { console.error('toggle-featured failed:', e); flash('Could not update \u2014 try again.'); render(); });
    return;
  }
  if (action === 'set-dash-preferred-booking') {
    if (!S.businessForm) return;
    S.businessForm.preferredBooking = value;
    render(); return;
  }
  if (action === 'save-business-info') {
    const provider = providerById(S.session);
    const f = S.businessForm;
    if (!provider || !f) return;
    const update = { instagram: f.instagram.trim(), website: f.website.trim(), preferredBooking: f.preferredBooking };
    db.collection('providers').doc(provider.id).update(update).then(function () {
      Object.assign(provider, update);
      flash('Business info updated.');
      render();
    }).catch(function (e) { console.error('save-business-info failed:', e); flash('Could not save \u2014 try again.'); render(); });
    return;
  }
  if (action === 'join-waitlist') {
    const f = S.waitlistJoinForm;
    if (!(f.name.trim() && f.phone.trim())) return;
    const entry = {
      providerId: S.activeVendorId, name: f.name.trim(), phone: f.phone.trim(),
      notes: f.notes.trim(), status: 'waiting', createdAt: Date.now(),
    };
    db.collection('waitlist').add(entry).then(function () {
      S.waitlistJoinSubmitted = true; render();
    }).catch(function (e) { console.error('join-waitlist failed:', e); flash('Could not join the waitlist \u2014 try again.'); render(); });
    return;
  }
  if (action === 'waitlist-mark-seated' || action === 'waitlist-remove') {
    // Both just take the entry off the active waitlist — "seated" keeps a
    // status history via update, "remove" is a delete for spam/no-shows.
    if (action === 'waitlist-mark-seated') {
      db.collection('waitlist').doc(value).update({ status: 'seated' }).then(function () {
        const w = S.data.waitlist.find(function (x) { return x.id === value; });
        if (w) w.status = 'seated';
        render();
      }).catch(function (e) { console.error('waitlist-mark-seated failed:', e); flash('Could not update \u2014 try again.'); render(); });
    } else {
      db.collection('waitlist').doc(value).delete().then(function () {
        S.data.waitlist = S.data.waitlist.filter(function (x) { return x.id !== value; });
        render();
      }).catch(function (e) { console.error('waitlist-remove failed:', e); flash('Could not remove \u2014 try again.'); render(); });
    }
    return;
  }
  if (action === 'go-provider-entry') { goTo(S.session ? 'providerDashboard' : 'providerLogin'); return; }
  if (action === 'go-provider-dashboard') { S.navHistory = []; goTo('providerDashboard'); return; }
  // Only the "Let's get you discovered" button uses this — a distinct action
  // from go-provider-dashboard so returning to the dashboard from anywhere
  // else (e.g. the "Back to Dashboard" buttons) never re-shows this prompt.
  if (action === 'finish-onboarding') { S.navHistory = []; goTo('providerNotifPrompt'); return; }
  if (action === 'enable-notifications-onboarding') {
    enableGlamrNotifications(S.session).then(function (ok) {
      if (!ok) flash('Couldn\u2019t turn on notifications \u2014 you can try again anytime from your dashboard.');
      S.navHistory = []; goTo('providerDashboard'); render();
    });
    return;
  }
  if (action === 'go-provider-signup') { goTo('providerSignup'); return; }
  if (action === 'go-provider-login') { goTo('providerLogin'); return; }

  if (action === 'set-service') {
    markSearchStarted();
    S.search.service = (S.search.service === value) ? null : value;
    render(); return;
  }
  if (action === 'set-when') {
    markSearchStarted();
    S.search.when = (S.search.when === value) ? null : value;
    render(); return;
  }
  if (action === 'do-search') {
    markSearchStarted();
    logEvent('search_completed');
    goTo('results');
    return;
  }
  if (action === 'view-opening') {
    const o = S.data.openings.find(function (x) { return x.id === value; });
    if (o) bumpProviderStat(o.providerId, 'offerViews');
    logEvent('appointment_viewed');
    goTo('request', { activeOpeningId: value });
    return;
  }
  if (action === 'book-instagram-click') {
    const o = S.data.openings.find(function (x) { return x.id === value; });
    if (o) {
      bumpProviderStat(o.providerId, 'instagramClicks');
      // Per-opening click count (separate from the vendor-level total above).
      // This is what a Cloud Function watches to know WHICH specific opening
      // to notify the specialist about — the vendor-level stat alone can't
      // tell you that. lastClickAt/bookingReminderSent feed the separate
      // "did you confirm this one yet?" check-in reminder.
      o.clicks = (o.clicks || 0) + 1;
      db.collection('openings').doc(o.id).update({
        clicks: firebase.firestore.FieldValue.increment(1),
        lastClickAt: firebase.firestore.FieldValue.serverTimestamp(),
        bookingReminderSent: false,
      }).catch(function (e) { console.error('opening click bump failed:', e); });
    }
    logEvent('instagram_book_clicked');
    return;
  }
  if (action === 'book-website-click') {
    const o = S.data.openings.find(function (x) { return x.id === value; });
    if (o) {
      bumpProviderStat(o.providerId, 'websiteClicks');
      o.clicks = (o.clicks || 0) + 1;
      db.collection('openings').doc(o.id).update({
        clicks: firebase.firestore.FieldValue.increment(1),
        lastClickAt: firebase.firestore.FieldValue.serverTimestamp(),
        bookingReminderSent: false,
      }).catch(function (e) { console.error('opening click bump failed:', e); });
    }
    logEvent('website_book_clicked');
    return;
  }
  // Booking-method badge on the vendor profile header (not tied to a single
  // opening, so no per-opening click count here — just the vendor-level stat).
  if (action === 'book-profile-click') {
    const provider = providerById(value);
    const method = target.getAttribute('data-method');
    if (provider) bumpProviderStat(provider.id, method === 'website' ? 'websiteClicks' : 'instagramClicks');
    logEvent(method === 'website' ? 'website_book_clicked' : 'instagram_book_clicked');
    return;
  }
  // Jump straight to the confirm screen from inside the dashboard — no
  // copy/paste needed since the vendor's already signed in and looking
  // right at this opening. goTo (not a raw view swap) so "Back" returns
  // them to the dashboard instead of dead-ending.
  if (action === 'go-confirm-booking') {
    goTo('confirmBooking', { activeOpeningId: value });
    return;
  }
  // One-tap "Mark as booked" from the no-login confirm link. No auth check
  // on purpose \u2014 the whole point is a vendor can do this straight from a
  // text message without signing in. Re-checks status so a stale/duplicate
  // tap (e.g. link opened twice) can't double-count or clobber a newer state.
  if (action === 'confirm-booking') {
    const o = S.data.openings.find(function (x) { return x.id === value; });
    if (!o || o.status !== 'active') { render(); return; }
    db.collection('openings').doc(value).update({ status: 'booked' }).then(function () {
      o.status = 'booked';
      bumpProviderStat(o.providerId, 'confirmedBookings');
      logEvent('booking_confirmed');
      render();
    }).catch(function (e) { console.error('confirm-booking failed:', e); flash('Could not update \u2014 try again.'); render(); });
    return;
  }
  if (action === 'zoom-photo') {
    const provider = providerById(value);
    bumpProviderStat(value, 'portfolioViews');
    S.lightbox = { url: target.getAttribute('data-url'), alt: provider ? provider.businessName + ' portfolio photo' : 'Portfolio photo' };
    render(); return;
  }
  if (action === 'close-lightbox') { S.lightbox = null; render(); return; }

  if (action === 'set-occasion') { if (!GLAMR_ME_ENABLED) return; S.glamr.occasion = value; render(); return; }
  if (action === 'build-glamr-plan') {
    if (!GLAMR_ME_ENABLED) return;
    if (!S.glamr.occasion) return;
    buildGlamrPlan();
    S.glamr.step = 'plan';
    render(); return;
  }

  if (action === 'toggle-signup-service') {
    const f = S.signupForm;
    const idx = f.services.indexOf(value);
    if (idx === -1) f.services.push(value); else f.services.splice(idx, 1);
    render(); return;
  }
  if (action === 'set-preferred-booking') {
    S.signupForm.preferredBooking = value;
    render(); return;
  }
  if (action === 'remove-signup-photo') {
    S.signupForm.portfolio.splice(Number(value), 1);
    S.signupForm.portfolioBlobs.splice(Number(value), 1);
    render(); return;
  }
  if (action === 'remove-dash-photo') {
    const provider = providerById(S.session);
    if (!provider) return;
    const removedURL = provider.portfolio[Number(value)];
    const newPortfolio = provider.portfolio.slice();
    newPortfolio.splice(Number(value), 1);
    db.collection('providers').doc(provider.id).update({ portfolio: newPortfolio }).then(function () {
      provider.portfolio = newPortfolio; render();
      deleteProviderImageByURL(removedURL);
    }).catch(function (e) { console.error('remove-dash-photo failed:', e); flash('Could not remove photo \u2014 try again.'); render(); });
    return;
  }
  if (action === 'submit-signup') {
    const f = S.signupForm;
    if (!(f.businessName && f.email && f.password && f.city && f.services.length)) return;
    f.error = '';
    let createdUid = null;
    auth.createUserWithEmailAndPassword(f.email.trim(), f.password).then(function (cred) {
      createdUid = cred.user.uid;
      // Photos were only held as local previews/blobs during signup (no uid
      // existed yet to upload under) — upload them for real now.
      const profilePhotoUpload = f.profilePhotoBlob
        ? uploadProviderImage(createdUid, f.profilePhotoBlob, 'profile.jpg')
        : Promise.resolve('');
      const portfolioUploads = Promise.all(f.portfolioBlobs.map(function (blob, i) {
        return uploadProviderImage(createdUid, blob, 'portfolio/' + Date.now() + '-' + i + '.jpg');
      }));
      return Promise.all([profilePhotoUpload, portfolioUploads]);
    }).then(function (results) {
      const profilePhotoURL = results[0], portfolioURLs = results[1];
      const providerDoc = {
        businessName: f.businessName, ownerName: f.ownerName, email: f.email.trim(),
        phone: f.phone, city: f.city, zip: f.zip, services: f.services.slice(),
        instagram: f.instagram, website: f.website, preferredBooking: f.preferredBooking || 'instagram', profilePhoto: profilePhotoURL, description: f.description, portfolio: portfolioURLs,
        profileViews: 0, offerViews: 0, portfolioViews: 0, instagramClicks: 0, websiteClicks: 0, confirmedBookings: 0, featured: false,
        notificationsEnabled: false, fcmToken: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), deal: null, pro: false,
      };
      return db.collection('providers').doc(createdUid).set(providerDoc).then(function () {
        const provider = Object.assign({ id: createdUid }, providerDoc, { createdAt: Date.now() });
        S.data.providers.push(provider);
        logEvent('provider_signup');
        S.session = provider.id;
        S.openingForm = freshOpeningForm(provider);
        S.businessForm = freshBusinessForm(provider);
        S.dealForm = null;
        S.navHistory = [];
        S.view = 'providerOnboarding';
        flash('Welcome! Your profile is live.');
        render();
      });
    }).catch(function (e) {
      f.error = e.code === 'auth/email-already-in-use' ? 'That email is already registered.'
        : e.code === 'auth/weak-password' ? 'Password should be at least 6 characters.'
        : 'Could not create account \u2014 try again.';
      render();
    });
    return;
  }
  if (action === 'submit-login') {
    const f = S.loginForm;
    auth.signInWithEmailAndPassword(f.email.trim(), f.password).then(function (cred) {
      f.error = '';
      const p = providerById(cred.user.uid);
      S.session = cred.user.uid;
      S.openingForm = freshOpeningForm(p);
      S.businessForm = freshBusinessForm(p);
      S.dealForm = null;
      S.navHistory = [];
      S.view = 'providerDashboard';
      loadWaitlistForProvider(cred.user.uid);
      render();
    }).catch(function (e) {
      f.error = 'No match \u2014 check email & password.';
      render();
    });
    return;
  }
  if (action === 'provider-logout') {
    auth.signOut();
    stopWaitlistListener();
    S.session = null; S.openingForm = null; S.businessForm = null; S.dealForm = null; S.navHistory = []; S.view = 'home'; render(); return;
  }

  if (action === 'post-opening') {
    const f = S.openingForm;
    if (!(f.service && f.date && f.time && f.price)) return;
    const opening = {
      providerId: S.session, status: 'active',
      service: f.service, date: f.date, time: f.time, price: Number(f.price),
      duration: f.duration, location: f.location, clicks: 0, pushSent: false, bookingReminderSent: false,
    };
    db.collection('openings').add(opening).then(function (ref) {
      const saved = Object.assign({ id: ref.id }, opening);
      S.data.openings.push(saved);
      logEvent('provider_opening_posted');
      const provider = providerById(S.session);
      S.openingForm = freshOpeningForm(provider);
      S.lastPostedOpening = saved;
      goTo('openingSuccess');
    }).catch(function (e) { console.error('post-opening failed:', e); flash('Could not post opening \u2014 try again.'); render(); });
    return;
  }
  if (action === 'toggle-opening') {
    const o = S.data.openings.find(function (x) { return x.id === value; });
    if (!o) return;
    const newStatus = o.status === 'active' ? 'unavailable' : 'active';
    // Reactivating (from 'unavailable' or a mistaken 'booked') resets the
    // click/notify state so a fresh round of clicks on this reopened slot
    // can trigger the notification again — otherwise pushSent:true from the
    // first go-round would silently block the specialist from ever being
    // notified about this opening again.
    const update = { status: newStatus };
    if (newStatus === 'active') { update.clicks = 0; update.pushSent = false; update.bookingReminderSent = false; }
    db.collection('openings').doc(value).update(update).then(function () {
      Object.assign(o, update); render();
    }).catch(function (e) { console.error('toggle-opening failed:', e); flash('Could not update opening \u2014 try again.'); render(); });
    return;
  }
  if (action === 'delete-opening') {
    db.collection('openings').doc(value).delete().then(function () {
      S.data.openings = S.data.openings.filter(function (x) { return x.id !== value; });
      render();
    }).catch(function (e) { console.error('delete-opening failed:', e); flash('Could not delete opening \u2014 try again.'); render(); });
    return;
  }

  if (action === 'add-deal-start') {
    const provider = providerById(S.session);
    S.dealForm = freshDealForm(provider, null);
    render(); return;
  }
  if (action === 'edit-deal') {
    const provider = providerById(S.session);
    S.dealForm = freshDealForm(provider, provider.deal);
    render(); return;
  }
  if (action === 'cancel-deal-form') { S.dealForm = null; render(); return; }
  if (action === 'save-deal') {
    const provider = providerById(S.session);
    const f = S.dealForm;
    if (!(f.title.trim() && f.service && f.originalPrice && f.dealPrice && f.expiresDate && f.expiresTime)) return;
    const deal = {
      id: f.id || uid(), title: f.title.trim(), service: f.service,
      originalPrice: Number(f.originalPrice), dealPrice: Number(f.dealPrice),
      discountPercent: f.discountPercent ? Number(f.discountPercent) : '',
      description: f.description, expiresAt: f.expiresDate + 'T' + f.expiresTime,
      scope: f.scope, specificDate: f.scope === 'specific' ? f.specificDate : '',
      specificTime: f.scope === 'specific' ? f.specificTime : '',
      image: f.image, createdAt: Date.now(),
    };
    db.collection('providers').doc(provider.id).update({ deal: deal }).then(function () {
      provider.deal = deal;
      logEvent('deal_posted');
      S.lastPostedDeal = deal;
      S.dealForm = null;
      goTo('dealSuccess');
    }).catch(function (e) { console.error('save-deal failed:', e); flash('Could not save deal \u2014 try again.'); render(); });
    return;
  }
  if (action === 'remove-deal') {
    const provider = providerById(S.session);
    db.collection('providers').doc(provider.id).update({ deal: null }).then(function () {
      provider.deal = null; render();
    }).catch(function (e) { console.error('remove-deal failed:', e); flash('Could not remove deal \u2014 try again.'); render(); });
    return;
  }
  if (action === 'remove-deal-image') {
    if (S.dealForm) {
      const removedURL = S.dealForm.image;
      S.dealForm.image = '';
      deleteProviderImageByURL(removedURL);
    }
    render(); return;
  }

  if (action === 'admin-enter') {
    if (S.adminCode === ADMIN_PASSCODE) { S.adminUnlocked = true; S.adminError = ''; }
    else { S.adminError = 'Wrong passcode'; }
    render(); return;
  }
  if (action === 'admin-delete') {
    const kind = target.getAttribute('data-kind');
    const id = target.getAttribute('data-value');
    db.collection(kind).doc(id).delete().then(function () {
      S.data[kind] = S.data[kind].filter(function (x) { return x.id !== id; });
      render();
    }).catch(function (e) { console.error('admin-delete failed:', e); flash('Could not delete \u2014 try again.'); render(); });
    return;
  }
}

function handleInput(el) {
  const bind = el.getAttribute('data-bind');
  if (bind) {
    let val = el.value;
    setPath(S, bind, val);
    // Re-render so anything derived from this field — enabled/disabled submit
    // buttons ("Post Opening", "Create Profile", etc.), sort order, conditional
    // fields — stays in sync with the new value. Re-rendering wipes focus and
    // cursor position by default, so capture and restore them around the call.
    const selStart = (typeof el.selectionStart === 'number') ? el.selectionStart : null;
    const selEnd = (typeof el.selectionEnd === 'number') ? el.selectionEnd : null;
    render();
    const restored = document.querySelector('[data-bind="' + bind + '"]');
    if (restored) {
      restored.focus();
      if (selStart !== null && restored.setSelectionRange) {
        try { restored.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text input */ }
      }
    }
    return;
  }
  const reqStatusId = el.getAttribute('data-bind-request-status');
  if (reqStatusId) {
    const r = S.data.requests.find(function (x) { return x.id === reqStatusId; });
    if (r) { r.status = el.value; persist(); }
    return;
  }
}

document.getElementById('app').addEventListener('click', function (e) {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  handleAction(t.getAttribute('data-action'), t);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.lightbox) { S.lightbox = null; render(); }
});
document.getElementById('app').addEventListener('input', function (e) {
  if (e.target.matches('[data-bind]')) handleInput(e.target);
});
document.getElementById('app').addEventListener('change', function (e) {
  if (e.target.matches('[data-bind]') || e.target.matches('[data-bind-request-status]')) { handleInput(e.target); return; }

  // Profile photo / logo upload (signup form or vendor dashboard)
  const profileTarget = e.target.getAttribute && e.target.getAttribute('data-file-profile');
  if (profileTarget && e.target.files && e.target.files[0]) {
    fileToCompressedDataURL(e.target.files[0], 480, 0.82, function (dataURL, blob) {
      if (profileTarget === 'signup') {
        // No uid yet (account doesn't exist until submit-signup) — hold the
        // preview + blob locally, upload for real once the account is created.
        S.signupForm.profilePhoto = dataURL;
        S.signupForm.profilePhotoBlob = blob;
        render();
      } else if (profileTarget === 'dash') {
        const provider = providerById(S.session);
        if (!provider) return;
        provider.profilePhoto = dataURL; render(); // optimistic local preview while it uploads
        uploadProviderImage(provider.id, blob, 'profile.jpg').then(function (url) {
          return db.collection('providers').doc(provider.id).update({ profilePhoto: url }).then(function () { return url; });
        }).then(function (url) {
          provider.profilePhoto = url; render(); flash('Profile photo updated.');
        }).catch(function (e) { console.error('profile photo upload failed:', e); flash('Could not update photo \u2014 try again.'); render(); });
      }
    });
    return;
  }

  // Deal image upload (add/edit deal form) — always inside the vendor
  // dashboard, so S.session is always a known uid here.
  const dealImageTarget = e.target.getAttribute && e.target.getAttribute('data-file-deal');
  if (dealImageTarget && e.target.files && e.target.files[0]) {
    fileToCompressedDataURL(e.target.files[0], 800, 0.8, function (dataURL, blob) {
      if (!S.dealForm) return;
      S.dealForm.image = dataURL; render(); // optimistic preview while it uploads
      uploadProviderImage(S.session, blob, 'deal-' + Date.now() + '.jpg').then(function (url) {
        if (S.dealForm) { S.dealForm.image = url; render(); }
      }).catch(function (e) { console.error('deal image upload failed:', e); flash('Could not upload deal image \u2014 try again.'); render(); });
    });
    return;
  }

  // Portfolio photo upload (signup form or vendor dashboard) — supports multiple files at once
  const portfolioTarget = e.target.getAttribute && e.target.getAttribute('data-file-portfolio');
  if (portfolioTarget && e.target.files && e.target.files.length) {
    const files = Array.prototype.slice.call(e.target.files);
    if (portfolioTarget === 'signup') {
      // No uid yet — keep previews + blobs locally, upload once the account exists.
      let remaining = files.length;
      files.forEach(function (file) {
        fileToCompressedDataURL(file, 800, 0.78, function (dataURL, blob) {
          S.signupForm.portfolio.push(dataURL);
          S.signupForm.portfolioBlobs.push(blob);
          remaining--;
          if (remaining === 0) render();
        });
      });
      return;
    }
    // dash — uid known, upload each photo to Storage, then commit the real
    // download URLs to Firestore once every file has finished uploading.
    const provider = providerById(S.session);
    if (!provider) return;
    let remaining = files.length;
    files.forEach(function (file) {
      fileToCompressedDataURL(file, 800, 0.78, function (dataURL, blob) {
        uploadProviderImage(provider.id, blob, 'portfolio/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg').then(function (url) {
          provider.portfolio.push(url);
        }).catch(function (e) {
          console.error('portfolio photo upload failed:', e); flash('Could not upload a photo \u2014 try again.');
        }).finally(function () {
          remaining--;
          if (remaining === 0) {
            db.collection('providers').doc(provider.id).update({ portfolio: provider.portfolio })
              .catch(function (e) { console.error('portfolio update failed:', e); flash('Could not save some photos \u2014 try again.'); });
            render();
          }
        });
      });
    });
    return;
  }
});

// Cycles each .g-rotate-label (the "N openings for X" text next to a
// vendor's "View Profile" button) through its list of services every few
// seconds, so a customer scanning the list sees what's actually open without
// clicking in. Reads straight from the DOM (data-items/data-idx), not from
// S, so it keeps ticking across re-renders without needing its own render()
// call — a render() elsewhere just gives it a fresh set of labels to find.
setInterval(function () {
  document.querySelectorAll('.g-rotate-label').forEach(function (el) {
    let items;
    try { items = JSON.parse(el.getAttribute('data-items') || '[]'); } catch (e) { items = []; }
    if (items.length < 2) return;
    const idx = (parseInt(el.getAttribute('data-idx') || '0', 10) + 1) % items.length;
    el.setAttribute('data-idx', String(idx));
    el.textContent = items[idx];
  });
}, 2600);

/* ---------------------------- boot ---------------------------- */

(async function boot() {
  render();
  S.data = await loadData();
  S.openingForm = null;

  // Deep link from a vendor's review QR code / shared link: ?review=<providerId>
  try {
    const params = new URLSearchParams(window.location.search);
    const reviewId = params.get('review');
    if (reviewId && providerById(reviewId)) {
      S.activeVendorId = reviewId;
      S.view = 'review';
    }
    // Deep link from a vendor's waitlist QR/link: ?waitlist=<providerId>
    const waitlistId = params.get('waitlist');
    if (waitlistId && providerById(waitlistId)) {
      S.activeVendorId = waitlistId;
      S.view = 'waitlistJoin';
    }
    // Hidden admin entry point (not linked anywhere in the UI): ?admin=1
    if (params.get('admin') === '1') {
      S.view = 'admin';
    }
    // One-tap booking confirmation link, sent to a vendor (by hand for now,
    // later automatically) after a customer clicks through to Instagram/their
    // website: ?confirm=<openingId>. Deliberately no login required \u2014 the
    // whole point is the vendor doesn't have to visit the dashboard.
    const confirmId = params.get('confirm');
    if (confirmId) {
      S.activeOpeningId = confirmId;
      S.view = 'confirmBooking';
    }
  } catch (e) { /* URLSearchParams unsupported or no location — ignore, app still works normally */ }

  render();

  // Firebase Auth persists login across page loads/tabs by default. On first
  // load after boot, if a vendor is already signed in, restore their dashboard
  // session instead of dropping them back to a logged-out view on refresh.
  let firstAuthCheck = true;
  auth.onAuthStateChanged(function (user) {
    if (user && providerById(user.uid)) {
      S.session = user.uid;
      S.businessForm = freshBusinessForm(providerById(user.uid));
      loadWaitlistForProvider(user.uid);
      // Also exclude 'confirmBooking' here \u2014 a vendor who's still logged in
      // from a previous session shouldn't get yanked off the one-tap confirm
      // link straight to their dashboard on page load.
      if (firstAuthCheck && S.view !== 'review' && S.view !== 'admin' && S.view !== 'confirmBooking') {
        S.openingForm = freshOpeningForm(providerById(user.uid));
        S.view = 'providerDashboard';
      }
    } else if (!user) {
      S.session = null;
      stopWaitlistListener();
    }
    firstAuthCheck = false;
    render();
  });
})();
</script>
